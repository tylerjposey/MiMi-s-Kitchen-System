openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingredients
    description: Ingredient purchasing records
  - name: menu
    description: Menu items and their ingredient recipes
  - name: settings
    description: Workspace profitability preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ingredients:
    get:
      operationId: listIngredients
      tags: [ingredients]
      summary: List all ingredients
      responses:
        "200":
          description: Ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
    post:
      operationId: createIngredient
      tags: [ingredients]
      summary: Add an ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "201":
          description: Created ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "400":
          description: Invalid ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ingredients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      operationId: updateIngredient
      tags: [ingredients]
      summary: Edit an ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "400":
          description: Invalid ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ingredient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteIngredient
      tags: [ingredients]
      summary: Delete an ingredient
      responses:
        "204":
          description: Ingredient deleted
        "404":
          description: Ingredient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ingredient is used in a recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /menu-items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List menu items with costs calculated from current ingredient prices
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a menu item and its recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid menu item or recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /menu-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item and replace its recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid menu item or recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item and its recipe
      responses:
        "204":
          description: Menu item deleted
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /menu-items/{id}/selling-price:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateMenuItemSellingPrice
      tags: [menu]
      summary: Update only the selling price, leaving the recipe and ingredient-cost baseline unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemPriceInput"
      responses:
        "200":
          description: Menu item with recalculated profitability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Invalid selling price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings:
    get:
      operationId: getWorkspaceSettings
      tags: [settings]
      summary: Get the profitability threshold
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
    put:
      operationId: updateWorkspaceSettings
      tags: [settings]
      summary: Set the low profit margin threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsInput"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "400":
          description: Invalid threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IngredientUnit:
      type: string
      enum: [lb, oz, gallon, quart, cup, fl oz, each]
    IngredientInput:
      type: object
      additionalProperties: false
      required: [name, purchaseQuantity, purchaseUnit, purchasePrice]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        purchaseQuantity:
          type: number
          exclusiveMinimum: 0
        purchaseUnit:
          $ref: "#/components/schemas/IngredientUnit"
        purchasePrice:
          type: number
          minimum: 0
        supplier:
          type: ["string", "null"]
          maxLength: 160
    Ingredient:
      type: object
      required: [id, name, purchaseQuantity, purchaseUnit, purchasePrice, costPerUnit, supplier, lastUpdated]
      properties:
        id:
          type: integer
        name:
          type: string
        purchaseQuantity:
          type: number
        purchaseUnit:
          $ref: "#/components/schemas/IngredientUnit"
        purchasePrice:
          type: number
        costPerUnit:
          type: number
          description: Purchase price in dollars divided by purchase quantity
        supplier:
          type: ["string", "null"]
        lastUpdated:
          type: string
          format: date-time
    RecipeLineInput:
      type: object
      additionalProperties: false
      required: [ingredientId, quantity, unit]
      properties:
        ingredientId:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: "#/components/schemas/IngredientUnit"
    MenuItemInput:
      type: object
      additionalProperties: false
      required: [name, sellingPrice, recipe]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        sellingPrice:
          type: number
          exclusiveMinimum: 0
        recipe:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeLineInput"
    MenuItemPriceInput:
      type: object
      additionalProperties: false
      required: [sellingPrice]
      properties:
        sellingPrice:
          type: number
          exclusiveMinimum: 0
    RecipeLine:
      type: object
      required: [ingredientId, ingredientName, quantity, unit, ingredientCost]
      properties:
        ingredientId:
          type: integer
        ingredientName:
          type: string
        quantity:
          type: number
        unit:
          $ref: "#/components/schemas/IngredientUnit"
        ingredientCost:
          type: number
    MenuItem:
      type: object
      required: [id, name, sellingPrice, recipeCost, profit, foodCostPercent, profitMarginPercent, costIncreased, recipe]
      properties:
        id:
          type: integer
        name:
          type: string
        sellingPrice:
          type: number
        recipeCost:
          type: number
        profit:
          type: number
        foodCostPercent:
          type: number
        profitMarginPercent:
          type: number
        costIncreased:
          type: boolean
          description: Ingredient cost increased since this menu item's recipe was last saved
        recipe:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLine"
    WorkspaceSettingsInput:
      type: object
      additionalProperties: false
      required: [lowProfitMarginThreshold]
      properties:
        lowProfitMarginThreshold:
          type: number
          minimum: 0
          maximum: 100
    WorkspaceSettings:
      type: object
      required: [lowProfitMarginThreshold]
      properties:
        lowProfitMarginThreshold:
          type: number
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

